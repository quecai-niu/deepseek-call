<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>DeepSeek Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <!-- ==================== Conversations ==================== -->
  <aside class="conversation-sidebar" aria-label="对话列表">
    <div class="sidebar-header">
      <span class="sidebar-title">对话</span>
      <button class="icon-btn" id="btnNewConversation" title="新对话">+</button>
    </div>
    <div class="auth-strip">
      <span class="auth-state" id="authStateText">未登录</span>
      <button class="text-btn" id="btnLogout" style="display:none">退出</button>
    </div>
    <div class="conversation-list" id="conversationList">
      <div class="conversation-empty">登录后显示历史对话</div>
    </div>
  </aside>

  <main class="chat-pane">
    <!-- ==================== Top Toolbar ==================== -->
    <div class="toolbar">
      <span class="toolbar-title" id="activeTitle">DeepSeek Chat</span>
      <div class="toolbar-actions">
        <button class="toolbar-btn" id="btnClear" title="开始新对话">&#128196;</button>
        <button class="toolbar-btn" id="btnCall" title="语音通话">&#128222;</button>
        <button class="toolbar-btn" id="btnDiagnose" title="诊断工具">&#128300;</button>
        <button class="toolbar-btn" id="btnTest" title="综合测试">🧪</button>
        <button class="toolbar-btn" id="btnSettings" title="设置">&#9881;</button>
      </div>
    </div>

    <!-- ==================== Messages ==================== -->
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">&#128172;</div>
        <div>登录后开始和 DeepSeek 对话吧</div>
      </div>
    </div>

    <!-- ==================== Voice Status ==================== -->
    <div class="voice-status" id="voiceStatus" style="display:none">
      <span class="voice-status-icon" id="voiceStatusIcon">&#127908;</span>
      <span class="voice-status-text" id="voiceStatusText"></span>
    </div>

    <!-- ==================== Input Area ==================== -->
    <div class="input-area">
      <div class="model-switcher">
        <button class="model-tag active" data-model="deepseek-v4-flash">快</button>
        <button class="model-tag" data-model="deepseek-v4-pro">思考</button>
        <button class="model-tag" data-model="deepseek-chat">旧V3</button>
        <button class="model-tag" data-model="deepseek-reasoner">旧R1</button>
      </div>
      <div class="input-row">
        <textarea id="inputBox" rows="1" placeholder="请先登录..."></textarea>
        <button class="send-btn" id="btnSend" disabled>&#9654;</button>
      </div>
    </div>
  </main>
</div>

<!-- ==================== Settings Overlay ==================== -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <h2>设置</h2>
      <button class="close-btn" id="btnCloseSettings">&times;</button>
    </div>

    <div class="settings-body">
    <div class="form-group">
      <label>账户</label>
      <input type="email" id="authEmailInput" placeholder="email@example.com" autocomplete="email">
      <input type="password" id="authPasswordInput" placeholder="密码" autocomplete="current-password">
      <div class="auth-actions">
        <button class="save-btn compact" id="btnSignIn">登录</button>
        <button class="secondary-btn" id="btnSignUp">注册</button>
        <button class="danger-btn compact" id="btnSignOut" style="display:none">退出登录</button>
      </div>
      <div class="hint" id="authMessage">Supabase Auth 登录后会保存并恢复你的历史对话</div>
    </div>

    <div class="form-group">
      <label>后端配置</label>
      <div class="config-status" id="backendConfigStatus">正在检测...</div>
      <div class="hint">DeepSeek Key 和 Supabase service role 只保存在后端环境变量中</div>
    </div>

    <div class="form-group">
      <label>思考模式</label>
      <div class="toggle-row">
        <span class="toggle-label">开启后模型将展示推理过程</span>
        <label class="toggle-switch">
          <input type="checkbox" id="thinkingToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="effort-group" id="effortGroup">
      <label>推理深度</label>
      <div class="effort-options">
        <button class="effort-opt" data-effort="low">Low</button>
        <button class="effort-opt" data-effort="medium">Medium</button>
        <button class="effort-opt active" data-effort="high">High</button>
        <button class="effort-opt" data-effort="max">Max</button>
      </div>
    </div>

    <div class="form-group">
      <label>联网搜索</label>
      <div class="toggle-row">
        <span class="toggle-label">开启后由后端 Tavily 配置执行搜索</span>
        <label class="toggle-switch">
          <input type="checkbox" id="webSearchToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>朗读速度：<span id="ttsRateValue">1.0x</span></label>
      <input type="range" id="ttsRate" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="form-group">
      <label>后端请求 JSON 预览</label>
      <textarea class="json-preview" id="jsonPreview" readonly></textarea>
    </div>
    </div>

    <div class="settings-footer">
      <button class="danger-btn" id="btnClearConv">开始新对话</button>
      <button class="save-btn" id="btnSaveSettings">保存设置</button>
    </div>
  </div>
</div>

<script defer src="/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/settings.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/chat-ui.js"></script>
<script defer src="js/voice-input.js"></script>
<script defer src="js/voice-output.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
