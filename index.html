<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>DeepSeek Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== Top Toolbar ==================== -->
<div class="toolbar">
  <span class="toolbar-title">DeepSeek Chat</span>
  <div class="toolbar-actions">
    <button class="toolbar-btn" id="btnClear" title="清空对话">&#128465;</button>
    <button class="toolbar-btn" id="btnCall" title="语音通话">&#128222;</button>
    <button class="toolbar-btn" id="btnSettings" title="设置">&#9881;</button>
  </div>
</div>

<!-- ==================== Messages ==================== -->
<div class="messages" id="messages">
  <div class="empty-state" id="emptyState">
    <div class="empty-state-icon">&#128172;</div>
    <div>开始和 DeepSeek 对话吧</div>
  </div>
</div>

<!-- ==================== Voice Status ==================== -->
<div class="voice-status" id="voiceStatus" style="display:none">
  <span class="voice-status-icon" id="voiceStatusIcon">&#127908;</span>
  <span class="voice-status-text" id="voiceStatusText"></span>
</div>

<!-- ==================== Input Area ==================== -->
<div class="input-area">
  <div class="model-switcher">
    <button class="model-tag" data-model="deepseek-v4-flash">快</button>
    <button class="model-tag active" data-model="deepseek-v4-pro">思考</button>
    <button class="model-tag" data-model="deepseek-chat">旧V3</button>
    <button class="model-tag" data-model="deepseek-reasoner">旧R1</button>
  </div>
  <div class="input-row">
    <textarea id="inputBox" rows="1" placeholder="输入消息..."></textarea>
    <button class="send-btn" id="btnSend" disabled>&#9654;</button>
  </div>
</div>

<!-- ==================== Settings Overlay ==================== -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <h2>设置</h2>
      <button class="close-btn" id="btnCloseSettings">&times;</button>
    </div>

    <div class="form-group">
      <label>API Key</label>
      <div class="key-input-row">
        <input type="password" id="apiKeyInput" placeholder="sk-...">
        <button class="toggle-vis-btn" id="btnToggleVis" title="显示/隐藏">&#128065;</button>
      </div>
      <div class="hint">密钥仅保存在本地浏览器中</div>
    </div>

    <div class="form-group">
      <label>思考模式</label>
      <div class="toggle-row">
        <span class="toggle-label">开启后模型将展示推理过程</span>
        <label class="toggle-switch">
          <input type="checkbox" id="thinkingToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="effort-group" id="effortGroup">
      <label>推理深度</label>
      <div class="effort-options">
        <button class="effort-opt" data-effort="low">Low</button>
        <button class="effort-opt" data-effort="medium">Medium</button>
        <button class="effort-opt active" data-effort="high">High</button>
        <button class="effort-opt" data-effort="max">Max</button>
      </div>
    </div>

    <div class="form-group">
      <label>请求体 JSON 预览</label>
      <textarea class="json-preview" id="jsonPreview" readonly></textarea>
    </div>

    <button class="danger-btn" id="btnClearConv">清空对话</button>
    <button class="save-btn" id="btnSaveSettings">保存设置</button>
  </div>
</div>

<script defer src="js/settings.js"></script>
<script defer src="js/chat-ui.js"></script>
<script defer src="js/voice-input.js"></script>
<script defer src="js/voice-output.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
